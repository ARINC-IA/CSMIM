%YAML 1.2
---
id: csmim.obj.aircraft.flight.1
description: >
  Flight data includes information about the current mission. This data is
  generally provided by flight management system(s) and relayed to the CSMIM
  system. Data is expected to be sent to the CSMIM system at either the native
  bus rate that is received by the data relay functionality, or at a sub-
  sampled bus rate. The messages provided herein will have the MQTT retain flag
  set if the nominal message period is > 1 sec.

  FIXME: maybe use v1/data/aircraft/information/flight/

resources:
  - id: origin
    type: string
    mode: r
    description: Origin Airport, 4-character ICAO Code

  - id: destination
    type: string
    mode: r
    description: Destination Airport, 4-character ICAO Code

  - id: number
    type: string[]
    mode: r
    description: Flight number assigned by the airline operator, including
      operator prefix. This field may contain code share flight numbers if
      available.

  - id: phase
    type: enum
    mode: r
    description: Phase of flight similar to ARINC834-8
    enum-values:
      - name: power_on
        key: 1
        description: system is powered on; not in another phase
      - name: taxi
        key: 2
        description: after 1st engine start
      - name: takeoff
        key: 3
        description: after 1st engine take-off power
      - name: climb
        key: 4
        description: after lift-off
      - name: cruise
        key: 5
        description: above 1500 ft
        FIXME: the agl alt is not how our phases change, we will need to come 
          up with a different description.

      - name: descent
        key: 6
        description: below 800 ft
        FIXME: Same comment as cruise

  - id: leg_start
    optional: true
    type: utc
    mode: r
    description: Time of the start of the current flight leg, value is updated
      when a new flight leg starts
