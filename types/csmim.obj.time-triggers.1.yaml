%YAML 1.2
---
id: csmim.obj.time-triggers.1
description: >
  Time triggers provide a message at a defined period to allow CSMIM devices
  to run triggered periodic operations. Time trigger resource messages are
  sent with the MQTT retain flag set.

  The time triggers type resides at the path "/TBD"

resources:
  - id: hr
    type: uint
    mode: r
    description: The current UTC hour using 24-hour notation, updated when
      the hour changes

  - id: min
    type: uint
    mode: r
    description: The current UTC minute, updated when the minute changes
