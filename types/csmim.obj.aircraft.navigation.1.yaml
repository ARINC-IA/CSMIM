%YAML 1.2
---
id: csmim.obj.aircraft.navigation.1
description: >
  The navigation type provides aircraft navigation type data that is
  managed by avionics systems and relayed to the CSMIM system. Data is expected
  to be sent to the CSMIM system at either the native bus rate that is received
  by the data relay functionality, or at a sub-sampled bus rate. The messages
  provided herein will have the MQTT retain flag set if the nominal message
  period is > 1 sec.

  The navigation type resides at the path "/TBD"

resources:
  - id: altitude
    type: float
    mode: r
    unit: m
    description: Aircraft Baro-Corrected Pressure Altitude, generally sent at a
      minimum nominal rate of 1 Hz

  - id: ground_speed
    optional: true
    type: float
    mode: r
    unit: m/s
    description: Ground speed, generally sent at a minimum nominal rate of 1 Hz

  - id: heading_true
    optional: true
    type: float
    mode: r
    unit: °
    description: Direction the aircraft is pointed relative to true north

  - id: latitude
    type: float
    mode: r
    unit: °
    description: Aircraft present position latitude

  - id: longitude
    type: float
    mode: r
    unit: °
    description: Aircraft present position longitude

  - id: mach
    optional: true
    type: float
    mode: r
    unit: mach
    description: Aircraft speed

  - id: air_speed
    optional: true
    type: float
    mode: r
    unit: m/s
    description: Aircraft air speed

  - id: track_angle_true
    optional: true
    type: float
    mode: r
    unit: °
    description: Direction the aircraft is moving relative to true north
