%YAML 1.2
---
id: csmim.obj.aircraft.cabin-state.1
supertypes: []
deprecated: false
description: >
  The cabin state type provides discrete values, sent as booleans, indicating
  the state of cabin-related functions like passenger address. All messages in
  this type will be sent with the MQTT retain flag set and are not expected to
  be periodic meesages.

  The cabin state type resides at the path "/TBD"

attributes: []
resources:
  - id: fsb
    type: bool
    mode: r
    description: Bool flag indicating fasten seat belt sign is active

  - id: keyline-pa
    type: bool
    mode: r
    description: Bool flag indicating if the PA Keyline is active

  - id: keyline-pram
    optional: true
    type: bool
    mode: r
    description: Bool flag indicating if the PRAM Keyline is active
