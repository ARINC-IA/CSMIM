%YAML 1.2
---
id: csmim.obj.aircraft.cabin-state.1
description: >
  The cabin state type provides discrete values, sent as booleans, indicating
  the state of cabin-related functions like passenger address. All messages in
  this type will be sent with the MQTT retain flag set and are not expected to
  be periodic messages.

  The cabin state type resides at the path "/TBD"

resources:
  - id: fasten_seatbelt_active
    optional: true
    type: bool
    mode: r
    description: Whether the fasten seat belt sign is active

  - id: passenger_address_active
    optional: true
    type: bool
    mode: r
    description: Whether the PA Keyline is active

  - id: pre_recorded_audio_active
    optional: true
    type: bool
    mode: r
    description: Whether the PRAM Keyline is active
