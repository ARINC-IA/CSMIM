id: csmim.obj.aircraft.audio-signals.1
description: >
  The audio signals type provides an indicator of
  the state of the different audio channels being used.

resources:
  - id: passenger_address
    type: enum
    mode: r
    description: Indicates the state of the passenger address system
    enum-values:
      - name: off
        key: 1
        description: passenger address system is not active
      - name: active
        key: 2
        description: passenger address system is active
      - name: pram
        key: 3
        description: pre-recorded message is active
    

