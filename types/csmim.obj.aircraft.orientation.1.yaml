%YAML 1.2
---
id: csmim.obj.aircraft.orientation.1
description: >
  The aircraft orientation data type provides aircraft navigation type data that
  is managed by avionics systems and relayed to the CSMIM system. Data is
  expected to be sent to the CSMIM system at either the native bus rate that is
  received by the data relay functionality, or at a sub-sampled bus rate. The
  messages provided herein will have the MQTT retain flag set if the nominal
  message period is > 1 sec.

resources:
  - id: true_heading
    type: float
    mode: r
    unit: °
    description: >
      Direction the aircraft is pointed relative to true north in degrees

  - id: track_angle
    optional: true
    type: float
    mode: r
    unit: °
    description: Direction the aircraft is moving relative to true north

  - id: flight_path_angle
    optional: true
    type: float
    mode: r
    unit: °
    description: >
      Describes whether the aircraft is climbing, descending, or flying level
      relative to the ground

  - id: pitch
    optional: true
    type: float
    mode: r
    unit: °
    description: >
      Pitch refers to the nose-up or nose-down attitude of the aircraft
      relative to the horizon.
