%YAML 1.2
---

id: csmim.obj.core.system-state.1
description: >
  The core system state, provided as discrete values sent as boolean, indicating
  the general state of the core. All messages in this type will be sent
  with the MQTT retain flag set and are not expected to be periodic messages.

resources:
  - id: maintenance_mode
    type: bool
    mode: r
    description: Whether the CSMIM system is in a maintenance mode
