%YAML 1.2
---
id: csmim.obj.aircraft.nav-data.1
description: >
  The navigation data type provides aircraft navigation type data that is
  managed by avionics systems and relayed to the CSMIM system. Data is expected
  to be sent to the CSMIM system at either the native bus rate that is received
  by the data relay functionality, or at a sub-sampled bus rate. The messages
  provided herein will have the MQTT retain flag set if the nominal message
  period is > 1 sec.

  The nav-data type resides at the path "/TBD"

resources:
  - id: altitude
    type: float
    mode: r
    description: Aircraft Baro Corrected Pressure Altitude in meters, generally
      sent at a minimum nominal rate of 1 Hz

  - id: ground-speed
    optional: true
    type: float
    mode: r
    description: Ground speed in meters per second, generally sent at a minimum
      nominal rate of 1 Hz

  - id: heading-true
    optional: true
    type: float
    mode: r
    description: Direction the aircraft is pointed relative to true north
      in degrees

  - id: latitude
    type: float
    mode: r
    description: Aircraft present position latitude in degrees

  - id: longitude
    type: float
    mode: r
    description: Aircraft present position longitude in degrees

  - id: mach
    optional: true
    type: float
    mode: r
    description: Aircraft speed in mach number

  - id: air-speed
    optional: true
    type: float
    mode: r
    description: Aircraft air speed in meters per second

  - id: temperature-static
    optional: true
    type: float
    mode: r
    description: Outside air temperature

  - id: track-angle-true
    optional: true
    type: float
    mode: r
    description: Direction the aircraft is moving relative to true north

  - id: wind-direction
    optional: true
    type: float
    mode: r
    description: Wind Direction relative to true north

  - id: wind-speed
    optional: true
    type: float
    mode: r
    description: Wind Speed
