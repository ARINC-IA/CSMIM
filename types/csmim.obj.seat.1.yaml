%YAML 1.2
---
id: csmim.obj.seat.1
supertypes:
  - csmim.obj.seat.sas-operational-status.1
  - csmim.obj.seat.occupied-status.1
  # - csmim.obj.fault-reporter.1 # Does not exist yet
description: >
  Represents the overall status of a seat within the cabin. The seat could be
  any type of seat. It may also comprise additional furniture that belongs to
  the seat, for example a privacy divider.

attributes:
  - key: row
    description: Seat row number as indicated in the cabin layout and to the
      passenger. For example "11". Note that seat row numbers need not be
      consecutive or always start at 1.
  - key: seat
    description: Seat position name in a column of seats, as indicated in the
      cabin layout and to the passenger. For example "A" or "C". Note that these
      need not be consecutive and can change from row to row.

resources:
  - id: position
    mode: r
    type: enum
    description: >
      The position of the seat, out of a list of predefined positions. A
      particular seat model may support only a subset of the positions. The
      enumeration may be extended in the future, therefore clients must be able
      to handle other values than those defined here for upward compatibility.
    enum-values:
      - name: undefined
        key: 0
        description: The seat is not in a defined seat position. E.g. the seat
          is in TTL position, but the leg rest is up.
      - name: ttl
        key: 1
        description: The seat is in TTL position. You must not use this as an
          indication for the seat being safe for TTL; use the "safe_for_ttl"
          resource instead.
      - name: ttl2
        key: 2
      - name: dine
        key: 3
      - name: relax
        key: 4
      - name: relax2
        key: 5
      - name: bed
        key: 6
      - name: user_stored
        key: 7
        description: The seat is in a user-stored preset position.
      - name: dot_disabled_person
        key: 8
        description: The seat is in a position for disabled persons to get in
          the seat.
      - name: cleaning
        key: 9

  - id: safe_for_ttl
    mode: r
    type: bool
    description: >
      Whether all criteria for safe to flight on seat and suite level are
      fulfilled. That is, the seat is in TTL position and all furniture is
      stored correctly.

  - id: ttl_lock
    mode: rw
    type: bool
    optional: true
    description: >
      Whether the seat cannot be moved out of TTL. Commands that move the seat
      into TTL position may still be allowed. The lockout feature can be
      commanded via this interface or another key line.

  - id: child_lockout
    mode: rw
    type: bool
    optional: true
    description: >
      Whether seat movements are disabled because the seat is occupied with a
      child. This feature should be commanded by the crew.

  - id: safety_event
    mode: r
    type: enum
    description: The last safety-related event on seat and suite level.
    enum-values:
      - name: none
        key: 0
      - name: seat_obstruction
        key: 1
      - name: door_obstruction
        key: 2
      - name: divider_obstruction
        key: 3

  - id: motion
    mode: x
    type: void
    optional: true
    description: >
      Motion command to change the seat position. The seat will send a code 400
      response if the combination of "part" and "direction" parameters is
      invalid. The seat will send a code 501 response if the specified "mode",
      "part" or "direction" are not supported by the particular seat model.

      The system architecture should be designed such that there is only one
      CSMIM endpoint sending commands to this resource. The commanding system
      should be designed to prevent conflicting commands and avoid rapid command
      changes, thereby promoting smooth and reliable seat operation.
      Despite these architectural safeguards, seats must independently validate
      and filter incoming commands to guarantee safe and proper operation under
      all circumstances. In particular, the seat control logic must detect and
      mitigate the effects of conflicting commands.
    parameters:
      - key: mode
        type: enum
        description: Defines how the seat actuation system reacts on the command
        enum-values:
          - name: cyclic
            key: 1
            description: Commands needs to be sent cyclically, otherwise the
              motion will stop. The typical period is 500 ms.
          - name: once
            key: 2
            description: The command needs to be sent only once. The seat will
              move until reaching the desired position.
      - key: part
        type: enum
        description: Defines whether the whole seat is to be moved, or just a
          specific part of the seat or furniture. This enumeration may be
          extended in the future.
        enum-values:
          - name: seat
            key: 1
          - name: leg_rest
            key: 2
          - name: seat_pan
            key: 3
          - name: back_rest
            key: 4
          - name: upper_back_rest
            key: 5
          - name: head_rest
            key: 6
          - name: sidearm
            key: 7
          - name: seat_track
            key: 8
          - name: ottoman
            key: 9
          - name: privacy_divider
            key: 10
      - key: direction
        type: enum
        description: The direction of the motion. This enumeration may be
          extended in the future, analogous to the "position" enumeration.
        enum-values:
          - name: stop
            key: 0
          - name: ttl
            key: 1
          - name: ttl2
            key: 2
          - name: dine
            key: 3
          - name: relax
            key: 4
          - name: relax2
            key: 5
          - name: bed
            key: 6
          - name: user_stored
            key: 7
          - name: dot_disabled_person
            key: 8
          - name: cleaning
            key: 9
          - name: up
            key: 100
          - name: down
            key: 101
          - name: in
            key: 102
          - name: out
            key: 103
          - name: forward
            key: 104
          - name: backward
            key: 105
          - name: rotate_clockwise
            key: 106
          - name: rotate_counterclockwise
            key: 107
          - name: lefthand_up
            key: 108
          - name: lefthand_down
            key: 109
          - name: righthand_up
            key: 110
          - name: righthand_down
            key: 111
