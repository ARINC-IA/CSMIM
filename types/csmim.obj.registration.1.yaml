%YAML 1.2
---
id: csmim.obj.registration.1
description: >
  CSMIM registration service interface as specified in ARINC 853.

  Clients should follow a certain procedure when connecting to the MQTT broker
  and registering at the CSMIM network. The goal is to reuse a stored MQTT
  session whenever possible; if not, attempt a registration renewal if possible;
  and only if that fails or is impossible, perform a full registration. To
  achieve this goal, the client must set the "sessionExpiryInterval" and the
  "cleanSession" parameters in the MQTT CONNECT message properly, and evaluate
  the "sessionPresent" parameter in the CONNACK message it receives.

resources:
  - id: claim
    mode: x
    type: void
    description: >
      Requests a full registration for the CSMIM endpoint. Clients must do a
      full registration if the endpoint has not performed a successful full
      registration yet, or the registration data differs from the previous full
      registration. In both cases, the client must have set "cleanSession=true"
      in its MQTT CONNECT message.
    errors:
      - code: 400
        description: >
          The request header or payload contains an error. The server should
          not retry the same registration request.
      - code: 403
        description: >
          At least one object could not be registered because the server does
          not possess "create" permission for its path. The server should not
          retry the same registration request; it may send a request without
          the offending object.
        dict-items:
          - key: path
            type: string
            description: One object path which produced the error
      - code: 409
        description: >
          At least one object could not be registered because its path has
          already been registered by another server; because its path equals or
          lies inside the path of a resource registered by another server; or
          because the path of one of its resources equals or contains an object
          registered by another server. The server may retry the same request
          after waiting for a certain time. Persistent errors indicate a
          configuration problem.
        dict-items:
          - key: path
            type: string
            description: One object path which produced the error
      - code: 413
        description: >
          The number of objects or resources to be registered exceeded the
          limit defined by the system integrator. The server should not retry
          the same registration request.
      - code: 429
        description: >
          The server has sent too many registration requests in a given amount
          of time. Upon this error code, the server must reduce its request
          rate.
      - code: 503
        description: >
          Registration is currently not possible. This may mean the CSMIM
          installation only allows registration in dedicated phases, for
          example on ground or during maintenance. The server should try
          registration renewal instead. If that is not possible, it may retry
          the same request after waiting for a certain time.
    parameters:
      - key: etag
        type: bytes
        description: Entity tag for this registration; size <= 8 bytes
      - key: types
        type: dict[]
        description: List of object types used by this registration message
        dict-items:
          - key: id
            type: string
          - key: supertypes
            type: string[]
            optional: true
          - key: resources
            type: dict[]
            dict-items:
              - key: id
                type: string
              - key: type
                type: string
              - key: mode
                type: string
              - key: optional
                type: bool
                optional: true
              - key: racc
                type: bool
                optional: true
      - key: objects
        type: dict[]
        description: List of objects to be registered
        dict-items:
          - key: path
            type: string
          - key: type
            type: string
          - key: discoverable
            type: bool
            optional: true
          - key: racc
            type: string[][]
            optional: true
          - key: rmod
            type: string[][]
            optional: true
          - key: resources
            type: dict[]
            dict-items:
              - key: id
                type: string
              - key: mode
                type: string
                optional: true
              - key: discoverable
                type: bool
                optional: true
              - key: racc
                type: string[][]
                optional: true
              - key: rmod
                type: string[][]
                optional: true

  - id: renew
    mode: x
    type: void
    description: >
      Requests renewal of the last successful full registration for the
      endpoint. Clients should do a registration renewal if the registration
      data is unchanged from the last successful full registration and the MQTT
      CONNACK packet indicated "sessionPresent=false", that is, if the attempt
      to recover the client's stored session at the MQTT broker failed. In any
      case, the client should have set "cleanSession=false" in its MQTT CONNECT
      message. If, however, CONNACK returned "sessionPresent=true", the session
      including the client's previous registration has been recovered, and the
      client must not perform registration renewal.
    parameters:
      - key: etag
        type: bytes
        description: Entity tag of the full registration to be renewed
