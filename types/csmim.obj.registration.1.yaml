        #        optional: true
        #      - key: racc
        #        type: string[][]
        #        optional: true
        #      - key: rmod
        #        type: string[][]
        #        optional: true

  - id: renew
    mode: x
    type: void
    description: >-
      Requests renewal of the last successful full registration for the
      endpoint. Preferred to full registration, if possible.
    parameters:
      - key: etag
        type: bytes
        description: Entity tag of the full registration to be recalled
