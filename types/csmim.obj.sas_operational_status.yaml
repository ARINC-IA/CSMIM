%YAML 1.2
---
id: csmim.obj.sas_operational_status.1
supertypes: []
description: >
  Interface which describes the operational status of a device or a group of
  devices (e.g. a complete seat).
attributes: []
resources:
  - id: operational_status
    mode: r
    type: enum
    description: >
      Describes the operational status of a device or a group of devices (e.g. a
      complete seat). In the future additional values might be added.
    enum-values:
      Initialization: 0  # The LRU is the process of initializing
      Normal: 1          # The LRU is in normal mode and fully operational
      Limited: 2         # The LRU is in limited mode and some functionality may not be available
      Fault: 3           # The LRU has some fault and may provide degraded functionality
      Fatal: 4           # The LRU has a fatal fault and is non-functional
      Calibration: 5     # The LRU is in calibration mode and is ready to accept calibration
      Disabled: 6        # The LRU has been disabled and cannot provide any functionality
      Offline: 7         # The LRU is offline
