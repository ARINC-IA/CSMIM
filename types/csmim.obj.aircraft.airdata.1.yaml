%YAML 1.2
---
id: csmim.obj.aircraft.airdata.1
description: >
  The airdata type provides aircraft weather type data that is
  managed or provided by avionics systems and relayed to the CSMIM system. Data
  is expected to be sent to the CSMIM system at either the native bus rate that
  is received by the data relay functionality, or at a sub-sampled bus rate. The
  messages provided herein will have the MQTT retain flag set if the nominal
  message period is > 1 sec.

  The airdata type resides at the path "/TBD"

resources:
  - id: temperature_static
    type: float
    mode: r
    unit: °C
    description: Outside air temperature

  - id: wind_direction
    type: float
    mode: r
    unit: °
    description: Wind Direction relative to true north

  - id: wind_speed
    type: float
    mode: r
    unit: m/s
    description: Wind speed
