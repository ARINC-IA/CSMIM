%YAML 1.2
---
id: csmim.obj.seat.sas-operational-status.1
description: >
  Interface which describes the operational status of a complete seat, a device
  or a group of devices in a seat within the cabin.

resources:
  - id: operational_status
    mode: r
    type: enum
    description: >
      The operational status of the seat, device or group of devices in the
      seat. This enumeration may be extended in the future.
    enum-values:
      - name: initialization
        key: 0
      - name: normal
        key: 1
      - name: limited
        key: 2
        description: Some functionality may not be available.
      - name: fault
        key: 3
        description: The LRU may provide degraded functionality.
      - name: fatal
        key: 4
        description: The LRU has a fatal fault and is non-functional.
      - name: calibration
        key: 5
      - name: disabled
        key: 6
      - name: offline
        key: 7
