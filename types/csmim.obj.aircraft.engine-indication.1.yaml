%YAML 1.2
---

id: csmim.obj.aircraft.engine-indication.1
description: >
  The aircraft state provides a discrete value, sent as boolean, indicating
  the state of the engine(s). All messages in this type will be sent
  with the MQTT retain flag set and are not expected to be periodic messages.

resources:
  - id: is_running
    type: bool
    mode: r
    description: Indicator of aircraft engines is running
