id: csmim.obj.aircraft.landing-gear-indication.1
description: >
  The aircraft state provides a discrete value, sent as boolean, indicating
  the state of the landing gear. All messages in this type will be sent
  with the MQTT retain flag set and are not expected to be periodic messages.

