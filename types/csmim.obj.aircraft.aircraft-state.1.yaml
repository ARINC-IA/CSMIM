%YAML 1.2
---
id: csmim.obj.aircraft.aircraft-state.1
description: >
  The aircraft state provides discrete values, sent as boolean, indicating
  the general state of the aircraft. All messages in this type will be sent
  with the MQTT retain flag set and are not expected to be periodic messages.

  The aircraft state type resides at the path "/TBD"

resources:
  - id: on-ground
    type: bool
    mode: r
    description: Bool flag indicating if the aircraft is on the ground

  - id: decompression
    optional: true
    type: bool
    mode: r
    description: Bool flag indicating if the aircraft is in a state of
      decompression

  - id: doors-open
    type: bool
    mode: r
    description: Bool flag indicating if any of the passenger doors are open

  - id: engines-on
    optional: true
    type: bool
    mode: r
    description: Bool flag indicating if any aircraft engines are on

  - id: maintenance-mode
    type: bool
    mode: r
    description: Bool flag indicating the applicable aircraft system is in a
      maintenance mode

  - id: comm-gnd-avail
    optional: true
    type: bool
    mode: r
    description: Bool flag indicating a terrestrial network-based offboard comm
      system is available

  - id: comm-sat-avail
    optional: true
    type: bool
    mode: r
    description: Bool flag indicating a Sat-based offboard comm system is
      available

  - id: smoke
    optional: true
    type: bool
    mode: r
    description: Bool flag indicating if a smoke alert is on
