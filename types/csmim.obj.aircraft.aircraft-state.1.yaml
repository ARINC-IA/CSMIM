%YAML 1.2
---

FIXME: >
  not yet linked in path folder.
  might have to be split into different domains and systems, see below

id: csmim.obj.aircraft.aircraft-state.1
description: >
  The aircraft state provides discrete values, sent as boolean, indicating
  the general state of the aircraft. All messages in this type will be sent
  with the MQTT retain flag set and are not expected to be periodic messages.

resources:
  - id: maintenance_mode
    type: bool
    mode: r
    description: Whether the CSMIM system is in a maintenance mode

    FIXME: maybe v1/data/core/csmim/state/maintenance_mode

  - id: on_ground
    optional: true
    type: bool
    mode: r
    description: Whether the aircraft is on the ground

    FIXME: >
      maybe v1/data/aircraft/landinggear/wheels/all/on_ground
      and   v1/data/aircraft/landinggear/wheels/any/on_ground

  - id: doors_open
    optional: true
    type: bool
    mode: r
    description: Whether any of the passenger or cargo doors are open

    FIXME: >
      maybe v1/data/aircraft/doors/<type>/any/is_open
      compiled from:
        v1/data/aircraft/doors/passenger/+/is_open
        v1/data/aircraft/doors/cargo/+/is_open
        v1/data/aircraft/doors/service/+/is_open

  - id: engines_on
    optional: true
    type: bool
    mode: r
    description: Whether any aircraft engines are on

    FIXME: maybe v1/data/aircraft/engineindication/engines_on

  - id: offboard_comm_available
    optional: true
    type: bool
    mode: r
    description: Whether any offboard communication mean is currently online

    FIXME: maybe use v1/data/aircraft/information/cabin/connection/+/state

