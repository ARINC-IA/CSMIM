%YAML 1.2
---
id: csmim.obj.aircraft.aircraft-state.1
description: >
  The aircraft state provides discrete values, sent as boolean, indicating
  the general state of the aircraft. All messages in this type will be sent
  with the MQTT retain flag set and are not expected to be periodic messages.

  The aircraft state type resides at the path "/TBD"

resources:
  - id: on_ground
    type: bool
    mode: r
    description: Whether the aircraft is on the ground

  - id: decompression
    optional: true
    type: bool
    mode: r
    description: Whether the aircraft is in a state of decompression

  - id: doors_open
    optional: true
    type: bool
    mode: r
    description: Whether any of the passenger doors are open

  - id: engines_on
    optional: true
    type: bool
    mode: r
    description: Whether any aircraft engines are on

  - id: maintenance_mode
    type: bool
    mode: r
    description: Whether the CSMIM system is in a maintenance mode

  - id: comm_gnd_avail
    optional: true
    type: bool
    mode: r
    description: Whether a terrestrial network-based offboard comm system is
      available

  - id: comm_sat_avail
    optional: true
    type: bool
    mode: r
    description: Whether a sat-based offboard comm system is available

  - id: smoke
    optional: true
    type: bool
    mode: r
    description: Whether a smoke alert is on
