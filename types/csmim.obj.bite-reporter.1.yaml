%YAML 1.2
---
id: csmim.obj.bite-reporter.1
supertypes:
  - csmim.obj.hw-id.1
description: An entity that provides fault messages.

attributes:
  - key: location
    description: >
      Unique physical location of the equipment (equivalent to Airbus FIN),
      aircraft type specific and managed by aircraft config manager.
  - key: function
    description: >
      Functional title of the equipment, may contain installation specifics
      (e.g. "SENSOR HUMIDITY, GALLEY1", "SENSOR CRNT, FOODREST"), aircraft type
      specific and managed by aircraft config manager.
  - key: ata
    description: >
      6 digit ATA chapter acc. to BAABi fault, e.g. "252201", aircraft type
      specific and managed by aircraft config manager.

resources:
  - id: bite_faults
    type: dict[]
    mode: r
    description: List of faults. Ideally only one fault message per device.
    dict-items:
      - key: mode
        type: enum
        description: Indication which process produced the fault message.
        enum-values:
          - name: continuous_monitoring
            key: 1
          - name: interactive_test
            key: 2
      - key: root_fault_code
        type: uint
        description: Supplier-assigned root fault code. Compressed information
          derived from clustering device fault events into troubleshooting
          procedures. Valid range is 1-20.
      - key: 2nd_obj
        optional: true
        type: string
        description: In case the equipment needs to accuse a second object (e.g.
          missing flight deck data, probe, wiring). The supplier defines the
          possible values for its equipment.
      - key: event_codes
        type: uint[]
        description: Supplier-assigned root cause code, clearly identifying the
          triggered fault monitor(s) (e.g. from FMEA). For deep troubleshooting
          by maintenance specialists.
      - key: supplier_code
        optional: true
        type: string
        description: Supplier-defined internal fault ID for additional guidance
          or deep troubleshooting.
      - key: text
        optional: true
        type: string
        description: Supplier-defined human-readable description of the fault
          for additional guidance of the maintenance personnel.
      - key: class
        optional: true
        description: >
          Failure class to indicate the severity (e. g. impacted crews). Using
          Single Aisle definition integer 1 to 3 (see ARINC 604), aircraft type
          specific and managed by aircraft config manager.
      - key: time
        optional: true
        type: utc
        description: Time of fault detection as additional information. May make
          sense if detection was much before publication.

  - id: bite_data
    type: dict[]
    mode: r
    racc: true
    description: Engineering data (access restricted)
    dict-items:
      - key: root_fault_code
        type: uint
        description: Reference to the corresponding fault message published in
          the "bite" resource.
      - key: content
        type: binary
