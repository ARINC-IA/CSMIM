%YAML 1.2
---
id: csmim.obj.bite-reporter.1
supertypes: [csmim.obj.hw-id.1.yaml]
description: An entity that provides failure messages.
attributes:
  - key: location
    description: >
      Unique physical location of the equipment (equivalent to Airbus FIN),
      Aircraft type specific and managed by Aircraft config manager.
  - key: function
    description: >
      Functional title of the equipment, may contain installation specifics
      (e.g. "SENSOR HUMIDITY, GALLEY1", "SENSOR CRNT, FOODREST"), Aircraft type
      specific and managed by Aircraft config manager.
  - key: ata
    description: >
      4-6 digit ATA chapter acc. to BAABi fault, e.g. "2522", Aircraft type
      specific and managed by Aircraft config manager.
  - key: class
    optional: true
    description: >
      Failure class to indicate the severity (e. g. impacted crews). Using
      Single Aisle definition integer  1 to 3 (see Arinc 604), Aircraft type
      specific and managed by Aircraft config manager.

resources:
  - id: bite
    type: dict[]
    mode: r
    description: List of faults. Ideally only one fault message per device.
    dict-values:
      - key: mode
        type: bool
        description: >
          indication if failure message is result of an interactive test (true)
          or continuous monitoring (false).
      - key: root_fault_code
        type: int
        description: >
          Supplier-assigned root fault code. Compressed information derived
          from clustering device fault events into troubleshooting procedures.
          Range: 1-20.
      - key: 2ndobj
        optional: true
        type: integer
        description: >
          In case the equipment needs to accuse a second object (e. g. missing
          flight deck data, probe, wiring..), chosen from a standardized table.
      - key: eventcode
        type: integer []
        description: >
          Supplier assigned root cause code, clearly identifying the triggered
          failure monitor(s) (e.g. from FMEA). For deep troubleshooting of
          maintenance specialists.
      - key: supplier_code
        optional: true
        type: string
        description: >
          Supplier-defined internal fault ID for additional guidance / deep
          troubleshooting.
      - key: text
        optional: true
        type: string
        description: >
          Supplier defined human-readable description of the fault for
          additional guidance of the maintenance personnel.
      - key: time
        optional: true
        type: utc
        description: >
          Time of fault detection as additional information. May make sense if
          detection was much before publication.

  - id: bite_data
    type: dict[]
    mode: r
    racc: true
    description: engineering data (access restricted)
    dict-values:
      - key: root_fault_code
        type: int
        description: reference to fault dict
      - key: content
        type: binary
