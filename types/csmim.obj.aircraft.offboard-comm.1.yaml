%YAML 1.2
---
id: csmim.obj.aircraft.offboard-comm.1
description: >
  The offboard-comm type provides discrete values, sent as boolean, indicating
  the state of aircraft offboard communication. All messages in this type will
  be published with the MQTT retain flag set and are not expected to be periodic
  messages.

  The offboard-comm type resides at the path "/TBD"

resources:
  - id: comm_avail
    type: bool
    mode: r
    description: Indication if any available offboard communication method is
      available for the CDS or associated devices

  - id: comm_gnd_avail
    optional: true
    type: bool
    mode: r
    description: Indication that a terrestrial network-based offboard comm
      system is available

  - id: comm_sat_avail
    optional: true
    type: bool
    mode: r
    description: Indication that a sat-based offboard comm system is available

  - id: comm_pax_avail
    optional: true
    type: bool
    mode: r
    description: Indication that a high-speed passenger connectivity system is
      available
