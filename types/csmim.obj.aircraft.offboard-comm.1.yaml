%YAML 1.2
---
id: csmim.obj.aircraft.offboard-comm.1
description: >
  The offboard-comm type provides information on the state of aircraft offboard
  communication. All messages in this type will be published with the MQTT retain
  flag set and are not expected to be periodic messages.

attributes:
  - id: name
    description: >
      human readable name of the communication link
      e. g. "Airline-Cellular", "Highspeed-SATCOM", "Classic-SATCOM", "Airport-Gatelink"

resources:
  - id: state
    type: enum
    mode: r
    description: Specifies the connection state of the communication link
    enum-values:
      - name: Offline
        key: 0
      - name: Online
        key: 1
      - name: Limited
        key: 2
        description: Reduced functionality mode