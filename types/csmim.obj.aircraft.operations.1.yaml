%YAML 1.2
---
id: csmim.obj.aircraft.operations.1
description: >
  Operations data includes data about the platform the system is operating on,
  and information about the current mission. This data is generally provided
  by flight management system(s) and relayed to the CSMIM system. Data is
  expected to be sent to the CSMIM system at either the native bus rate that
  is received by the data relay functionality, or at a sub-sampled bus rate.
  The messages provided herein will have the MQTT retain flag set if the
  nominal message period is > 1 sec.

  The aircraft operations type resides at the path "/TBD"

resources:
  - id: ac_icao24
    optional: true
    type: bytes
    mode: r
    description: 24-bit ICAO Hex Code

  - id: ac_type
    type: string
    mode: r
    description: Aircraft registration ICAO 4-character aircraft type

  - id: ac_serial
    optional: true
    type: string
    mode: r
    description: Aircraft serial number assigned by manufacturer

  - id: tail_id
    type: string
    mode: r
    description: Aircraft Registration Number

  - id: origin
    type: string
    mode: r
    description: Origin Airport, 4-character ICAO Code

  - id: destination
    type: string
    mode: r
    description: Destination Airport, 4-character ICAO Code

  - id: distance_to_go
    optional: true
    type: uint
    mode: r
    unit: km
    description: Distance to the planned destination

  - id: time_to_destination
    optional: true
    type: uint
    mode: r
    unit: s
    description: Estimated time to arrival at destination

  - id: leg_start
    type: utc
    mode: r
    description: Time of the start of the current flight leg, value is updated
      when a new flight leg starts

  - id: flight_number
    type: string[]
    mode: r
    description: Flight number assigned by the airline operator, including
      operator prefix. This field may contain code share flight numbers if
      available.

  - id: flight_phase
    type: enum
    mode: r
    description: Phase of flight
    enum-values:
      - name: gate
        key: 1
        description: TBD
      - name: taxi
        key: 2
        description: TBD
      - name: takeoff
        key: 3
        description: TBD
      - name: climb
        key: 4
        description: TBD
      - name: cruise
        key: 5
        description: TBD
      - name: descent
        key: 6
        description: TBD
