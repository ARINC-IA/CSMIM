%YAML 1.2
---
id: csmim.obj.seat.occupied_status.1
supertypes: []
description: >
  Interface which describes the occupied status of a seat within the cabin.
attributes:
resources:
  - id: occupied_status
    mode: r
    type: enum
    description: Describes the occupied status of a seat.
    enum-values:
      none: 0           # Seat is empty
      occupied: 1       # Seat is occupied with person
      baggage: 2        # Baggage is detected on seat
      unknown: 3        # Signal from sensor is indefinite
