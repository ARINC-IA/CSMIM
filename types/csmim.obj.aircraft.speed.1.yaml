%YAML 1.2
---
id: csmim.obj.aircraft.speed.1
description: >
  The aircraft speed data type provides aircraft data that is
  managed by avionics systems and relayed to the CSMIM system.

resources:
  - id: true_air
    type: float
    mode: r
    unit: kts
    description: Aircraft true air speed in knots

  - id: ground
    type: float
    mode: r
    unit: kts
    description: Ground speed in knots

  - id: mach
    optional: true
    type: float
    mode: r
    unit: mach
    description: Aircraft speed in mach number
